<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Choose a password | Swift Logistics</title><link rel="stylesheet" href="css/style.css"></head><body><main class="page-shell"><div class="page-intro"><p class="eyebrow">Account recovery</p><h1>Choose a new password</h1><p>Use at least 8 characters.</p></div><form id="reset-password-form" class="panel form-panel"><label>New password<input name="password" type="password" required minlength="8" autocomplete="new-password"></label><label>Confirm password<input name="confirmPassword" type="password" required minlength="8" autocomplete="new-password"></label><button class="button button-primary" type="submit">Update password</button><p id="auth-message" class="form-message" aria-live="polite"></p></form></main><script src="js/app.js"></script></body></html>
