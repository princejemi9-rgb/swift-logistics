<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create shipment | Swift Logistics</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><nav class="nav"><a class="brand" href="index.html">Swift<span>Logistics</span></a><button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-menu">Menu</button><div class="menu" id="site-menu"><a class="active" href="ship.html">Ship</a><a href="rates.html">Get a quote</a><a href="track.html">Track</a><a href="support.html">Help</a><a class="nav-account" href="login.html">Sign in</a></div></nav></header><main class="page-shell"><div class="page-intro"><p class="eyebrow">Create delivery</p><h1>Send a package</h1><p>Complete the details below and we’ll generate your tracking number.</p></div><form id="shipment-form" class="panel form-panel"><div class="form-section"><h2>Sender</h2><div class="form-row"><label>Full name<input name="senderName" required autocomplete="name"></label><label>Email address<input name="senderEmail" type="email" required autocomplete="email"></label></div><label>Collection address<input name="origin" required placeholder="City, country"></label></div><div class="form-section"><h2>Recipient</h2><div class="form-row"><label>Full name<input name="recipientName" required></label><label>Phone number<input name="recipientPhone" type="tel" required></label></div><label>Delivery address<input name="destination" required placeholder="City, country"></label></div><div class="form-section"><h2>Package</h2><div class="form-row"><label>Contents<input name="contents" required placeholder="e.g. Clothing"></label><label>Weight (kg)<input name="weight" type="number" min="0.1" step="0.1" required></label><label>Service<select name="service"><option>Express</option><option selected>Priority</option><option>Economy</option></select></label></div></div><label class="check-label"><input type="checkbox" name="terms" required> I confirm the shipment details are accurate and the contents are permitted.</label><button class="button button-primary" type="submit">Create shipment</button><p id="shipment-message" class="form-message" aria-live="polite"></p></form></main><footer class="site-footer"><p>© 2026 Swift Logistics. Demo service.</p></footer><script src="js/app.js"></script></body></html>
